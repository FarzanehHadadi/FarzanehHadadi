name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # هر روز ساعت ۳ صبح UTC
  workflow_dispatch:       # امکان اجرای دستی

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== Stats Card ==========
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=FarzanehHadadi&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== Top Languages Card ==========
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=FarzanehHadadi&layout=compact&hide_progress=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== Streak Card ==========
      - name: Generate Streak Card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=FarzanehHadadi&theme=default&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== Commit & Push ==========
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats cards" || exit 0
          git push
